appId: com.yanukadeneth99.cueclock
name: Add a cue
---
- clearState
- launchApp
# Close the Android setup sheet the way a user does.
- extendedWaitUntil:
    visible: "Android setup"
    timeout: 20000
# Continue sits at the bottom of the sheet, so scroll down to it.
- scrollUntilVisible:
    element:
      id: "setup-continue"
    speed: 90
    timeout: 60000
- tapOn:
    id: "setup-continue"
# Analytics question only shows on a fresh install.
- tapOn:
    id: "consent-decline"
    optional: true
# Declining asks once more, so confirm.
- tapOn:
    id: "optout-confirm"
    optional: true
- extendedWaitUntil:
    visible:
      id: "add-cue-button"
    timeout: 10000
- tapOn:
    id: "add-cue-button"
# The phone time picker opens by itself for a new cue, accept its time.
- tapOn:
    text: "OK"
    optional: true
# Move the target hour up by one, so the cue is not at the default time.
- tapOn:
    id: "target-time-hour-up"
- scrollUntilVisible:
    element:
      id: "cue-name-input"
    speed: 90
    timeout: 60000
- tapOn:
    id: "cue-name-input"
- inputText: "Maestro Test Cue"
- hideKeyboard
- tapOn:
    id: "cue-save"
- assertVisible: "Maestro Test Cue"
- takeScreenshot: add-cue-done
