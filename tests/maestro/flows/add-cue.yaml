appId: com.yanukadeneth99.cueclock
name: Add a cue
---
- runFlow:
    file: common/first-run.yaml
    env:
      SHOT: add-cue-01-first-run
- tapOn:
    id: "add-cue-button"
# The phone time picker opens by itself for a new cue, accept its time.
- tapOn:
    text: "OK"
    optional: true
# Move the target hour up by one, so the cue is not at the default time.
- tapOn:
    id: "target-time-hour-up"
- takeScreenshot: add-cue-02-modal-open
- scrollUntilVisible:
    element:
      id: "cue-name-input"
    speed: 90
    timeout: 60000
- tapOn:
    id: "cue-name-input"
- inputText: "Maestro Test Cue"
- hideKeyboard
- tapOn:
    id: "cue-save"
- assertVisible: "Maestro Test Cue"
- takeScreenshot: add-cue-03-done
