appId: com.yanukadeneth99.cueclock
name: Change the second zone
---
- runFlow:
    file: common/first-run.yaml
    env:
      SHOT: second-zone-01-first-run
- tapOn:
    id: "zone2-card"
- extendedWaitUntil:
    visible:
      id: "zone-search"
    timeout: 10000
- tapOn:
    id: "zone-search"
# Search by the full zone name, so the typed text cannot be mistaken for the "Tokyo" row.
- inputText: "Asia/Tok"
- hideKeyboard
- takeScreenshot: second-zone-02-modal-open
- tapOn: "Tokyo"
# The clock card shows the city in capitals, followed by its zone, for example "TOKYO (GMT+9)".
- assertVisible: "(?i)^tokyo \\(.*$"
- assertNotVisible: "(?i)^colombo \\(.*$"
- takeScreenshot: second-zone-03-done
