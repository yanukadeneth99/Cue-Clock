# =============================================================================
# Web App Verify (PR build check)
# -----------------------------------------------------------------------------
# Builds the APP's web export on every pull request that touches app/, so a change that breaks the web build is caught while the PR is still open - not after a release tag has already tried to ship it live via web-deploy.yml.
#
# Why this exists: app/ ships to Android AND web from one codebase, but until now only Android was built on a PR (android-release-verify.yml). A change that compiles for React Native but breaks the web static export sailed through review and only exploded when Coolify ran the export at release time. That is exactly how the uuid/xcode ERR_REQUIRE_ESM deploy break slipped in.
#
# Node version: read from app/.nvmrc (Node 22), the SAME version the web deploy must use. Pinning them together is the whole point - the deploy failure came from the deploy server running an older Node than the code needs, so this check is only trustworthy if it runs the matching Node.
#
# Why 22 and not something newer: 22.12.0 is the first Node that lets a CommonJS `require()` load an ES module without a flag, which is what the failed deploy needed. Anything at or above that works; there is no reason to reach further. The deploy server gets a matching 22.14.0 via app/nixpacks.toml - see that file for why the version alone was not enough.
#
# Web flow: after the build, the export is served on a local port and the Playwright tests in tests/web/ open it in Chrome and run through the app like a user would (add, edit and delete cues, settings, zones). Gemini then reviews the screenshots and leaves advisory warnings. The report is kept for 7 days.
#
# Runs on: pull requests changing anything under app/ or tests/web/, the AI screenshot review, or this file itself (so edits here are verified too). Website- or docs-only PRs skip it.
# Uses: No secrets are needed. The optional GEMINI_API_KEY only turns on the advisory screenshot review.
# =============================================================================
name: Web App Verify

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-app-verify.yml"
      # The web tests run here, so a test change is tested by its own PR.
      - "tests/web/**"
      # The AI screenshot review runs here too, so a change to it is tested by its own PR.
      - ".github/scripts/review-screenshots.js"
      - ".github/scripts/lib/screenshot-review.js"
      - "tests/ai-review/**"

# If new commits land on the same PR while a check is running, cancel the old
# check - only the newest code needs verifying.
concurrency:
  group: web-app-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-web-build:
    name: Verify Web App Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version comes from app/.nvmrc so it can never drift from what the
      # deploy uses. checkout v4 to match every other workflow in this repo.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: "npm"
          cache-dependency-path: |
            app/package-lock.json
            tests/web/package-lock.json

      # `npm ci` installs the exact versions in the lockfile and fails outright
      # if the lockfile and package.json disagree - a useful check by itself on
      # a dependency-bump PR (this is the class of change that broke the deploy).
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # The real test: the same web export web-deploy.yml runs on a release.
      # We use build:web (not build:web:deploy) on purpose - the extra deploy
      # step only stamps a version from the GitHub releases API, which would
      # make this check flaky on network hiccups without testing anything the
      # export itself does not already cover.
      - name: Build web export
        working-directory: app
        run: npm run build:web

      # ---- Web flow: open the built app in Chrome and add a cue ----
      # A plain static server is enough: the export is ready-made files. It keeps running in the background for the next steps.
      - name: Serve web export
        run: |
          nohup python3 -m http.server 8081 --bind 127.0.0.1 --directory app/dist > "$RUNNER_TEMP/web-server.log" 2>&1 &
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8081/

      - name: Install web test dependencies
        working-directory: tests/web
        # The Playwright packages need no install scripts; the browser is installed in the next step.
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        working-directory: tests/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run web tests
        working-directory: tests/web
        env:
          CUE_WEB_URL: http://127.0.0.1:8081
        run: ./node_modules/.bin/playwright test

      # Gemini looks at each screenshot and flags anything that looks wrong. Advisory only: this step never fails the check.
      # Fork and Dependabot PRs get no key, so the script just prints a notice there. See tests/ai-review/README.md.
      # It runs before the upload below, so its review.json goes into the same artifact.
      - name: AI screenshot review
        if: always()
        # The review is advisory, so a slow or stuck review never fails the check.
        timeout-minutes: 20
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: node .github/scripts/review-screenshots.js tests/web/test-results web

      # The report (with screenshots and a trace when a test fails) is kept for a week.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          retention-days: 7
          if-no-files-found: warn
