# =============================================================================
# Android Release Verify (PR dry-run)
# -----------------------------------------------------------------------------
# A practice run of the release build on every pull request, so a broken build
# is caught while the PR is still open — not at 2am when someone tags a real
# release. It builds the app exactly like a release would, then throws the
# result away.
#
# Runs on:  pull requests that change anything under app/, or that edit the beta /
#           promote release workflows (so a broken release path is caught before
#           merge), or that edit this file itself. Website- or docs-only PRs
#           skip this build.
#
# Uses:     NO real secrets. A dummy version number (0.0.24), a fake Firebase
#           config, and a signing key generated on the spot and discarded.
#           Nothing goes to Google Play. A test APK, locked so only Sunny can open it, is kept for 1 day.
# =============================================================================
name: Android Release Verify

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-beta.yml'
      - '.github/workflows/android-promote.yml'
      # This file too, so a change to this check is tested by its own PR.
      - '.github/workflows/android-release-verify.yml'

# If new commits land on the same PR while a check is running, cancel the old
# check — only the newest code needs verifying.
concurrency:
  group: android-release-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release-build:
    name: Verify Android Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # v4.0.2 and later no longer ask for the old "tools" package that Google removed, which made v3 fail on every run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Health check: fails early if any library versions don't match what
      # this Expo SDK expects.
      - name: Run Expo Doctor
        working-directory: app
        run: npx expo-doctor

      # Stamp a fixed dummy version — the number is meaningless because this
      # build is never shipped anywhere.
      - name: Update version for dry-run
        working-directory: app
        env:
          VERSION: 0.0.24
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/prepare-android-release.js

      # Placeholder settings instead of real secrets — a PR from a fork must
      # be buildable without access to any of them.
      - name: Create stub .env
        working-directory: app
        run: |
          echo "EAS_PROJECT_ID=dev-local-open-source" > .env
          echo "EAS_OWNER=open-source-contributor" >> .env
          echo "EXPO_PUBLIC_CLARITY_KEY=" >> .env

      # A fake Firebase config with the right shape — enough to make the
      # build succeed without touching any real Firebase project.
      - name: Create stub google-services.json
        working-directory: app
        run: |
          cat > google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "cue-clock-ci",
              "storage_bucket": "cue-clock-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef123456",
                  "android_client_info": {
                    "package_name": "com.yanukadeneth99.cueclock"
                  }
                },
                "api_key": [{ "current_key": "fake-api-key" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Generate the native Android project folder from the Expo config —
      # this is what Gradle actually builds below.
      - name: Generate Android native project
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # Prebuild regenerates the native project, wiping the version stamped
      # earlier — so stamp it again directly into the native files.
      - name: Sync Android native version after prebuild
        working-directory: app
        env:
          VERSION: 0.0.24
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/prepare-android-release.js --sync-native

      # Make a brand-new signing key just for this run (real releases use the
      # secret production key; this one is discarded with the runner).
      - name: Generate throwaway signing keystore
        working-directory: app/android
        run: |
          keytool -genkeypair \
            -alias androidreleasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -keystore release.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Cue Clock Dry Run, OU=CI, O=Cue Clock, L=Colombo, S=Western, C=LK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release AAB
        working-directory: app/android
        run: |
          # ARM-only: must mirror android-beta.yml / android-internal.yml so
          # this dry-run verifies the exact ABI set production ships. x86/x86_64
          # were dropped — their native splits crashed emulators/ChromeOS with
          # SoLoaderDSONotFoundError (missing libc++_shared.so).
          ./gradlew bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=android

      # The Play-style build above must keep Firebase reporting on, so prove the "off" switches are not in it.
      - name: Check Play-style build has reporting on
        working-directory: app/android
        run: |
          if grep -qE 'firebase_(crashlytics|analytics|performance)_collection_(enabled|deactivated)"[^>]*android:value="(false|true)"' app/src/main/AndroidManifest.xml; then
            echo "Test-only reporting switches leaked into the Play-style build"; exit 1
          fi

      # ---- Test APK for Sunny's test phone (locked so only Sunny can open it) ----
      - name: Read test phone public key
        id: recipient
        run: |
          key=$(grep -vE '^\s*(#|$)' .github/test-apk-recipient.txt | head -1)
          case "$key" in age1*) echo "key=$key" >> "$GITHUB_OUTPUT" ;; *) echo "No key, skipping test APK" ;; esac

      - name: Install age (file locking tool)
        if: steps.recipient.outputs.key != ''
        run: sudo apt-get install -y age

      # Rebuild the native project from scratch with the test switch on, so nothing from the Play-style build is reused.
      - name: Generate test native project
        if: steps.recipient.outputs.key != ''
        working-directory: app
        env:
          EXPO_PUBLIC_CUE_TEST_BUILD: '1'
          VERSION: 0.0.24
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx expo prebuild --platform android --clean
          node scripts/prepare-android-release.js --sync-native

      # Stop if any reporting switch is missing, or if a Clarity key slipped in.
      - name: Check test build has reporting off
        if: steps.recipient.outputs.key != ''
        working-directory: app
        run: |
          m=android/app/src/main/AndroidManifest.xml
          for f in crashlytics_collection_enabled analytics_collection_enabled performance_collection_enabled; do
            grep -q "firebase_$f\" android:value=\"false\"" $m || { echo "missing $f=false"; exit 1; }
          done
          for f in analytics_collection_deactivated performance_collection_deactivated; do
            grep -q "firebase_$f\" android:value=\"true\"" $m || { echo "missing $f=true"; exit 1; }
          done
          grep -qE '^EXPO_PUBLIC_CLARITY_KEY=$' .env || { echo "Clarity key must be empty"; exit 1; }

      - name: Build test APK
        if: steps.recipient.outputs.key != ''
        working-directory: app/android
        env:
          EXPO_PUBLIC_CUE_TEST_BUILD: '1'
        run: |
          keytool -genkeypair -alias androidreleasekey -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS \
            -keystore release.keystore -storepass android -keypass android -dname "CN=Cue Clock Test, OU=CI, O=Cue Clock, C=LK"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=android

      # Lock the APK with the public key, then delete the unlocked copy before anything is uploaded.
      - name: Lock test APK
        if: steps.recipient.outputs.key != ''
        working-directory: app/android/app/build/outputs/apk/release
        run: |
          age -r "${{ steps.recipient.outputs.key }}" -o cue-clock-test.apk.age app-release.apk
          rm -f app-release.apk

      - name: Upload locked test APK
        if: steps.recipient.outputs.key != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-clock-test-apk
          path: app/android/app/build/outputs/apk/release/cue-clock-test.apk.age
          retention-days: 1
          if-no-files-found: error
